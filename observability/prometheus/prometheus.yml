global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Alert rules
rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Demo microservices (direct scrape — ensures alerts fire if Alloy is down)
  - job_name: "company"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["company:8081"]
  - job_name: "job"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["job:8082"]
  - job_name: "review"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["review:8083"]
  - job_name: "gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8084"]

  # Observability infrastructure
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:1234"]

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
