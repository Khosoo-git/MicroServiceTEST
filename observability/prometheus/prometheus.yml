global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "spring-services"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - companyms:8081
          - jobms:8082
          - reviewms:8083
          - gateway-ms:8084
  - job_name: "python-stress-test"
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: "observability-infra"
    static_configs:
      - targets:
          - loki:3100
          - tempo:3200
  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:1234"]
