groups:
  - name: service_alerts
    interval: 10s
    rules:
      # Service Down Alert
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          service: "{{ $labels.job }}"
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} on instance {{ $labels.instance }} has been down for more than 1 minute."
          service_name: "{{ $labels.job }}"
          status: "critical"

      # High Response Time Alert
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, job)) > 2
        for: 5m
        labels:
          severity: warning
          service: "{{ $labels.job }}"
        annotations:
          summary: "High response time detected for {{ $labels.job }}"
          description: "95th percentile response time is above 2 seconds for service {{ $labels.job }}"
          service_name: "{{ $labels.job }}"
          status: "warning"

      # High Error Rate Alert
      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job) / sum(rate(http_server_requests_seconds_count[5m])) by (job) > 0.05
        for: 5m
        labels:
          severity: critical
          service: "{{ $labels.job }}"
        annotations:
          summary: "High error rate detected for {{ $labels.job }}"
          description: "Error rate is above 5% for service {{ $labels.job }}"
          service_name: "{{ $labels.job }}"
          status: "critical"

      # High Memory Usage Alert
      - alert: HighMemoryUsage
        expr: (jvm_memory_used_bytes / jvm_memory_max_bytes) > 0.85
        for: 5m
        labels:
          severity: warning
          service: "{{ $labels.job }}"
        annotations:
          summary: "High memory usage detected for {{ $labels.job }}"
          description: "JVM memory usage is above 85% for service {{ $labels.job }}"
          service_name: "{{ $labels.job }}"
          status: "warning"

      # Database Connection Pool Exhausted
      - alert: DatabaseConnectionPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels:
          severity: critical
          service: "{{ $labels.job }}"
        annotations:
          summary: "Database connection pool nearly exhausted for {{ $labels.job }}"
          description: "Active connections are above 90% of max pool size for service {{ $labels.job }}"
          service_name: "{{ $labels.job }}"
          status: "critical"
