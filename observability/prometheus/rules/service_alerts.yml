groups:
  - name: service_warning_alerts
    interval: 10s
    rules:

      # 🟠 Service Degradation (NOT full down)
      - alert: ServiceDegraded
        expr: up == 0
        for: 30s
        labels:
          severity: warning
          service: "{{ $labels.job }}"
        annotations:
          summary: "Service {{ $labels.job }} might be unstable"
          description: "Service {{ $labels.job }} is unreachable or restarting frequently. Possible early failure signal."
          status: "warning"

      # 🟠 High Response Time (early warning)
      - alert: HighResponseTimeWarning
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, job)) > 1
        for: 3m
        labels:
          severity: warning
          service: "{{ $labels.job }}"
        annotations:
          summary: "Response time increasing for {{ $labels.job }}"
          description: "P95 latency > 1s indicates performance degradation"
          status: "warning"

      # 🟠 Increasing Error Rate (trend-based early warning)
      - alert: ErrorRateIncreasing
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job)
            /
            sum(rate(http_server_requests_seconds_count[5m])) by (job)
          ) > 0.02
        for: 3m
        labels:
          severity: warning
          service: "{{ $labels.job }}"
        annotations:
          summary: "Error rate increasing for {{ $labels.job }}"
          description: "Error rate > 2% indicates early instability"
          status: "warning"

      # 🟠 Memory Pressure (not critical yet)
      - alert: MemoryPressureWarning
        expr: (jvm_memory_used_bytes / jvm_memory_max_bytes) > 0.75
        for: 5m
        labels:
          severity: warning
          service: "{{ $labels.job }}"
        annotations:
          summary: "Memory pressure rising for {{ $labels.job }}"
          description: "JVM memory usage above 75% - potential leak or load spike"
          status: "warning"

      # 🟠 DB Connection Pressure (early saturation)
      - alert: DBConnectionPressure
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.7
        for: 3m
        labels:
          severity: warning
          service: "{{ $labels.job }}"
        annotations:
          summary: "DB connection usage high for {{ $labels.job }}"
          description: "Connection pool > 70% indicates approaching saturation"
          status: "warning"