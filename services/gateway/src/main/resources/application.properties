# Gateway Service Configuration
spring.application.name=gateway
server.port=8084

# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=http://servicereg:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Logging Configuration (Loki)
logging.file.name=/logs/gateway.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=DEBUG

# Tracing Configuration (Tempo/OpenTelemetry)
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://tempo:4318/v1/traces
management.otlp.tracing.protocol=http/protobuf

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Gateway Routes
spring.cloud.gateway.server.webmvc.routes[0].id=company_service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://company:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/companies/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=CircuitBreaker=name=companyCB,fallbackUri=forward:/fallback/companies

spring.cloud.gateway.server.webmvc.routes[1].id=job_service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://job:8082
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/jobs/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=CircuitBreaker=name=jobCB,fallbackUri=forward:/fallback/jobs

spring.cloud.gateway.server.webmvc.routes[2].id=review_service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://review:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/reviews/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=CircuitBreaker=name=reviewCB,fallbackUri=forward:/fallback/reviews

spring.cloud.gateway.server.webmvc.routes[3].id=eureka-server
spring.cloud.gateway.server.webmvc.routes[3].uri=http://servicereg:8761
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/eureka/main
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=SetPath=/

spring.cloud.gateway.server.webmvc.routes[4].id=eureka-server-static
spring.cloud.gateway.server.webmvc.routes[4].uri=http://servicereg:8761
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/eureka/**

# CORS Configuration
client.error.cors.allowed-origin-patterns=${CLIENT_ERROR_CORS_PATTERNS:*}
