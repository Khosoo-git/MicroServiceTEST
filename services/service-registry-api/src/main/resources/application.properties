spring.application.name=service-registry-api
server.port=8085

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://postgres:5432/observability
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Initialize database with scripts
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/migration.sql,classpath:db/init.sql
spring.sql.init.continue-on-error=true

# Observability config directories
observability.config_dir=/observability
observability.alloy.reload-url=http://alloy:1234/-/reload
logs_dir=/logs

# Authentication (DISABLED by default for development)
auth.enabled=false

# Disable Eureka client (we're not using service discovery)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Logging
logging.file.name=/logs/service-registry-api.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
